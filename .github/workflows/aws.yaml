name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR || '/var/www/questionfinder' }}
      APP_NAME: questionfinder
      NGINX_SITE_NAME: questionfinder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Prepare deployment bundle
        run: |
          mkdir -p release
          cp -r backend dist package.json package-lock.json server.js release/
          tar -czf release.tar.gz -C release .

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -p "$EC2_PORT" "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload bundle to EC2
        run: |
          scp -i ~/.ssh/ec2_key -P "$EC2_PORT" release.tar.gz "$EC2_USER@$EC2_HOST:/tmp/questionfinder-release.tar.gz"

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2_key -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e
            APP_DIR="${{ env.EC2_APP_DIR }}"
            APP_NAME="${{ env.APP_NAME }}"

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER:$USER" "$APP_DIR"
            tar -xzf /tmp/questionfinder-release.tar.gz -C "$APP_DIR"
            cd "$APP_DIR"

            cat > .env << 'ENVEOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          PG_TABLE_NAME=${{ secrets.PG_TABLE_NAME || 'question_submissions' }}
          PG_QUESTIONS_TABLE=${{ secrets.PG_QUESTIONS_TABLE || 'question_bank' }}
          PGSSLMODE=${{ secrets.PGSSLMODE || 'require' }}
          PORT=${{ secrets.PORT || '5000' }}
          ENVEOF

            if ! command -v npm >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y curl ca-certificates
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            node --version
            npm --version

            npm ci --omit=dev

            sudo apt-get update
            sudo apt-get install -y curl ca-certificates python3 python3-pip python3-venv

            if [ -f backend/requirements.txt ]; then
              python3 -m pip install --break-system-packages -r backend/requirements.txt
            fi

            sudo tee "/etc/systemd/system/$APP_NAME.service" >/dev/null << SERVICEEOF
          [Unit]
          Description=Question Finder backend
          After=network.target

          [Service]
          Type=simple
          User=$USER
          WorkingDirectory=$APP_DIR
          EnvironmentFile=$APP_DIR/.env
          Environment=NODE_ENV=production
          ExecStart=/usr/bin/node $APP_DIR/server.js
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SERVICEEOF

            sudo systemctl daemon-reload
            sudo systemctl enable "$APP_NAME"
            sudo systemctl restart "$APP_NAME"
            sleep 5

            if ! sudo systemctl is-active --quiet "$APP_NAME"; then
              sudo systemctl status "$APP_NAME" --no-pager
              sudo journalctl -u "$APP_NAME" -n 100 --no-pager
              exit 1
            fi

            curl -fsS "http://127.0.0.1:${{ secrets.PORT || '5000' }}/api/health"

            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            sudo tee /etc/nginx/sites-available/${{ env.NGINX_SITE_NAME }} >/dev/null << 'NGINXEOF'
          server {
            listen 80;
            server_name ${{ secrets.NGINX_SERVER_NAME || '_' }};

            root ${{ env.EC2_APP_DIR }}/dist;
            index index.html;

            location /api/ {
              proxy_pass http://127.0.0.1:${{ secrets.PORT || '5000' }};
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
            }

            location / {
              try_files $uri $uri/ /index.html;
            }
          }
          NGINXEOF

            sudo ln -sfn /etc/nginx/sites-available/${{ env.NGINX_SITE_NAME }} /etc/nginx/sites-enabled/${{ env.NGINX_SITE_NAME }}
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx || sudo systemctl restart nginx
            curl -fsS "http://127.0.0.1/api/health"

            rm -f /tmp/questionfinder-release.tar.gz
          EOF







